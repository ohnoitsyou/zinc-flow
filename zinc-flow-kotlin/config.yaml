flow:
  entryPoints:
  - ingress
  processors:
    ingress:
      type: LogAttribute
      config:
        prefix: '[in] '
    router:
      type: RouteOnAttribute
      config:
        routes: 'urgent: priority == urgent; bulk: priority == bulk'
    elevate:
      type: UpdateAttribute
      config:
        key: priority
        value: elevated
    enrich:
      type: UpdateAttribute
      config:
        key: route
        value: bulk-queue
    sink:
      type: PutStdout
      config:
        prefix: '[out] '
    LogAttribute:
      type: LogAttribute
  connections:
    ingress:
      success:
      - router
      original:
      - LogAttribute
    router:
      urgent:
      - elevate
      bulk:
      - enrich
      unmatched:
      - sink
    elevate:
      success:
      - sink
    enrich:
      success:
      - sink
    LogAttribute:
      success:
      - sink
sources: [
  ]
